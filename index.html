<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ma Playlist</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0b11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Playlist">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0b0b11;--card:#1a1a26;--line:#2a2a3a;--txt:#ecebf5;--dim:#8b89a3;--acc:#a855f7;--acc2:#22d3ee}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:
    radial-gradient(800px 500px at 10% -10%,#2a1152 0,transparent 60%),
    radial-gradient(700px 400px at 100% 5%,#07323b 0,transparent 55%),var(--bg);
    color:var(--txt);min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(190px + env(safe-area-inset-bottom)) 16px}
  .wrap{max-width:720px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  h1{font-size:25px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,var(--acc) 65%,var(--acc2));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 9px #4ade80;margin-left:auto;flex-shrink:0}
  .dot.off{background:#fb923c;box-shadow:0 0 9px #fb923c}
  .offbar{display:none;background:rgba(251,146,60,.13);border:1px solid rgba(251,146,60,.3);color:#fdba74;
    border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.5;margin-bottom:14px}
  body.offline .offbar{display:block}

  .panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:8px}
  input[type=text],input[type=search]{flex:1;min-width:0;background:#0e0e17;border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:12px 13px;font-size:16px;outline:none}
  input:focus{border-color:var(--acc)}
  button{border:none;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:650;color:#fff;
    background:linear-gradient(135deg,var(--acc),#7c3aed);cursor:pointer;flex-shrink:0}
  button:disabled{opacity:.45}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500;padding:11px 14px;font-size:13px}
  .files{display:block;width:100%;margin-top:9px;text-align:center}
  .msg{font-size:12.5px;color:var(--dim);margin-top:10px;min-height:16px;line-height:1.5}
  .msg.ok{color:#4ade80}.msg.err{color:#fb7185}
  input[type=file]{display:none}

  .bar{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .bar h2{font-size:14px;font-weight:700}
  .cnt{background:rgba(168,85,247,.17);color:#d8b4fe;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700}
  .bar input{padding:8px 11px;font-size:14px}

  ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  li{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid transparent;border-radius:13px;
    padding:9px 10px;transition:.15s;animation:in .22s both}
  @keyframes in{from{opacity:0;transform:translateY(5px)}}
  li.on{border-color:var(--acc);background:linear-gradient(90deg,rgba(168,85,247,.22),rgba(34,211,238,.05))}
  li.dis{opacity:.4}
  .th{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#2a2a3a;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:17px}
  .meta{flex:1;min-width:0}
  .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 6px;border-radius:5px;flex-shrink:0}
  .tag.deezer{background:rgba(162,56,255,.2);color:#c88aff}
  .tag.spotify{background:rgba(29,185,84,.18);color:#4ade80}
  .tag.youtube{background:rgba(255,0,51,.18);color:#ff7a94}
  .tag.local{background:rgba(34,211,238,.18);color:#67e8f9}
  .x{background:none;border:none;color:#5c5a70;padding:8px;font-size:15px}

  .empty{text-align:center;padding:34px 14px;color:var(--dim);font-size:13.5px;line-height:1.6}
  .empty b{display:block;font-size:30px;margin-bottom:8px}

  .player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,14,23,.93);
    backdrop-filter:blur(18px);border-top:1px solid var(--line);
    padding:11px 16px calc(11px + env(safe-area-inset-bottom)) 16px}
  .pwrap{max-width:720px;margin:0 auto}
  .npt{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .npa{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  iframe{width:100%;border:none;border-radius:11px;margin-top:9px;background:#000;display:block}
  .ctrl{display:flex;align-items:center;gap:14px;margin-top:9px}
  .ctrl button{background:none;padding:4px;font-size:21px;color:var(--txt)}
  .ctrl .pp{background:var(--txt);color:#0b0b11;width:44px;height:44px;border-radius:50%;font-size:17px;
    display:flex;align-items:center;justify-content:center;padding:0}
  .seek{flex:1;display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:9px;background:#39394f;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--acc)}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ma Playlist</h1>
    <div class="dot" id="dot"></div>
  </header>

  <div class="offbar">📴 Hors connexion — tes fichiers locaux sont lisibles, les titres Deezer reviendront avec le réseau.</div>

  <div class="panel">
    <div class="row">
      <input type="text" id="url" placeholder="Lien Deezer, Spotify ou YouTube" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="go">Importer</button>
    </div>
    <button class="ghost files" id="pick">📁 Ajouter mes fichiers audio (écoutables hors connexion)</button>
    <input type="file" id="file" accept="audio/*" multiple>
    <div class="msg" id="msg"></div>
  </div>

  <div class="panel">
    <div class="bar">
      <h2>Titres</h2><span class="cnt" id="cnt">0</span>
      <input type="search" id="q" placeholder="Rechercher…">
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty"><b>🎧</b>Playlist vide.<br>Colle un lien Deezer ou ajoute tes fichiers.</div>
  </div>
</div>

<div class="player">
  <div class="pwrap">
    <div class="npt" id="npt">Aucun titre</div>
    <div class="npa" id="npa">Choisis un morceau dans la liste</div>
    <div id="frame"></div>
    <div class="ctrl hide" id="ctrl">
      <button id="prev">⏮</button>
      <button class="pp" id="pp">▶</button>
      <button id="next">⏭</button>
      <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" value="0" min="0" max="1000"><span id="dur">0:00</span></div>
    </div>
  </div>
</div>
<audio id="au"></audio>

<script>
/* ---------------- Stockage ---------------- */
const DB={
  async get(k){ if(window.storage){try{const r=await window.storage.get(k);return r?r.value:null}catch(e){return null}}
                try{return localStorage.getItem(k)}catch(e){return null} },
  async set(k,v){ if(window.storage){try{await window.storage.set(k,v)}catch(e){} return}
                  try{localStorage.setItem(k,v)}catch(e){} }
};
/* Fichiers audio -> IndexedDB */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("plfiles",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function fPut(id,b){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");
  t.objectStore("f").put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fGet(id){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readonly"),
  q=t.objectStore("f").get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function fDel(id){const d=await idb();return new Promise(res=>{const t=d.transaction("f","readwrite");
  t.objectStore("f").delete(id);t.oncomplete=res;t.onerror=res})}

/* ---------------- État ---------------- */
const S={tracks:[],cur:null,q:"",url:null};
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON={deezer:"🎵",spotify:"🟢",youtube:"▶️",local:"💾"};
const mmss=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
const say=(t,k="")=>{$("msg").textContent=t;$("msg").className="msg "+k};
const save=()=>DB.set("library",JSON.stringify(S.tracks.map(t=>({...t,blobUrl:undefined}))));

/* ---------------- Liens ---------------- */
function parse(u){u=u.trim();let m;
  if(m=u.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/))
    return{p:"spotify",type:m[1],id:m[2],embed:`https://open.spotify.com/embed/${m[1]}/${m[2]}`,h:m[1]==="track"?152:300};
  if(m=u.match(/deezer\.(?:com|page\.link)\/(?:[a-z]{2}\/)?(track|album|playlist)\/(\d+)/))
    return{p:"deezer",type:m[1],id:m[2],embed:`https://widget.deezer.com/widget/dark/${m[1]}/${m[2]}`,h:m[1]==="track"?152:300};
  if(m=u.match(/[?&]list=([A-Za-z0-9_-]+)/))
    return{p:"youtube",type:"playlist",id:m[1],embed:`https://www.youtube.com/embed/videoseries?list=${m[1]}`,h:200};
  if(m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/))
    return{p:"youtube",type:"track",id:m[1],embed:`https://www.youtube.com/embed/${m[1]}`,
      thumb:`https://img.youtube.com/vi/${m[1]}/mqdefault.jpg`,h:200};
  return null;}

function jsonp(url,ms=7000){return new Promise((res,rej)=>{
  const cb="dz"+Math.random().toString(36).slice(2),s=document.createElement("script");
  const t=setTimeout(()=>{end();rej(Error("timeout"))},ms);
  function end(){clearTimeout(t);delete window[cb];s.remove()}
  window[cb]=d=>{end();res(d)};s.onerror=()=>{end();rej(Error("ko"))};
  s.src=url+(url.includes("?")?"&":"?")+"output=jsonp&callback="+cb;document.body.appendChild(s)})}

async function deezerAll(type,id){
  let out=[],i=0;
  for(let p=0;p<15;p++){
    const d=await jsonp(`https://api.deezer.com/${type}/${id}/tracks?limit=100&index=${i}`);
    if(!d||!d.data||!d.data.length)break;
    d.data.forEach(t=>out.push({id:"dz"+t.id,p:"deezer",title:t.title,artist:(t.artist||{}).name||"",
      thumb:(t.album||{}).cover_small||"",embed:`https://widget.deezer.com/widget/dark/track/${t.id}`,h:152}));
    if(d.data.length<100)break;i+=100;
  }
  return out;}

async function oembed(p,url){try{
  const a=p==="spotify"?`https://open.spotify.com/oembed?url=${encodeURIComponent(url)}`
                       :`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(url)}`;
  const r=await fetch(a);if(!r.ok)throw 0;const d=await r.json();return{title:d.title,thumb:d.thumbnail_url};
}catch(e){return null}}

/* ---------------- Import ---------------- */
async function importUrl(){
  const raw=$("url").value.trim();if(!raw)return say("Colle d'abord un lien.","err");
  if(!navigator.onLine)return say("Pas de réseau — l'import a besoin d'une connexion.","err");
  const i=parse(raw);if(!i)return say("Lien non reconnu (Deezer, Spotify ou YouTube).","err");
  $("go").disabled=true;say("Récupération…");
  let add=[];
  try{
    if(i.p==="deezer"&&i.type!=="track"){add=await deezerAll(i.type,i.id);if(!add.length)throw Error("vide")}
    else throw Error("one");
  }catch(e){
    const o=i.p==="deezer"?null:await oembed(i.p,raw);
    const lab={playlist:"Playlist",album:"Album",track:"Titre",episode:"Épisode",show:"Podcast"}[i.type]||"Média";
    add=[{id:i.p+i.id,p:i.p,title:(o&&o.title)||lab+" "+i.p,artist:i.type==="track"?"":lab+" complet · lecteur intégré",
      thumb:(o&&o.thumb)||i.thumb||"",embed:i.embed,h:i.h}];
    if(i.p==="deezer"&&i.type!=="track")
      say("⚠️ L'aperçu Claude bloque l'API Deezer : playlist ajoutée en un seul bloc. Une fois le site en ligne (GitHub Pages / Netlify), les titres s'importeront un par un.","err");
    else if(i.type!=="track")say("Lister les titres n'est possible que sur Deezer — ajouté avec son lecteur (il joue tout).","ok");
  }
  const seen=new Set(S.tracks.map(t=>t.id)),fresh=add.filter(t=>!seen.has(t.id));
  S.tracks=S.tracks.concat(fresh);await save();render();
  $("url").value="";$("go").disabled=false;
  if(fresh.length>1)say(`✅ ${fresh.length} titres ajoutés.`,"ok");
  else if(fresh.length===1&&!/ok|err/.test($("msg").className))say("✅ Ajouté.","ok");
  else if(!fresh.length)say("Déjà dans la playlist.");
}

async function addFiles(fl){
  let n=0;
  for(const f of fl){
    const id="lo"+Date.now()+Math.random().toString(36).slice(2,7);
    try{await fPut(id,f)}catch(e){say("Mémoire insuffisante pour ce fichier.","err");continue}
    const name=f.name.replace(/\.[^.]+$/,"");const sp=name.split(/\s+-\s+/);
    S.tracks.push({id,p:"local",title:sp.length>1?sp.slice(1).join(" - "):name,artist:sp.length>1?sp[0]:"Fichier local",thumb:""});
    n++;
  }
  await save();render();say(n?`✅ ${n} fichier(s) ajouté(s) — écoutables hors connexion.`:"Aucun fichier ajouté.",n?"ok":"err");
}

/* ---------------- Lecture ---------------- */
const au=$("au");
async function play(id){
  const t=S.tracks.find(x=>x.id===id);if(!t)return;
  S.cur=id;$("npt").textContent=t.title;$("npa").textContent=t.artist||"—";
  if(t.p==="local"){
    $("frame").innerHTML="";$("ctrl").classList.remove("hide");
    const b=await fGet(id);
    if(!b){say("Fichier introuvable.","err");return}
    if(S.url)URL.revokeObjectURL(S.url);
    S.url=URL.createObjectURL(b);au.src=S.url;au.play().catch(()=>{});$("pp").textContent="⏸";
  }else{
    au.pause();$("ctrl").classList.add("hide");
    $("frame").innerHTML=navigator.onLine
      ? `<iframe src="${esc(t.embed)}" height="${t.h||152}" allow="autoplay; encrypted-media; clipboard-write; picture-in-picture" allowfullscreen loading="lazy"></iframe>`
      : `<div style="padding:13px;font-size:12.5px;color:#fdba74">Lecture en streaming indisponible hors connexion.</div>`;
  }
  render();
}
function step(d){
  const loc=S.tracks.filter(t=>t.p==="local"),i=loc.findIndex(t=>t.id===S.cur);
  if(i<0)return;const n=loc[(i+d+loc.length)%loc.length];if(n)play(n.id);
}
$("pp").onclick=()=>{au.paused?(au.play(),$("pp").textContent="⏸"):(au.pause(),$("pp").textContent="▶")};
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
au.ontimeupdate=()=>{if(au.duration){$("seek").value=au.currentTime/au.duration*1000;
  $("cur").textContent=mmss(au.currentTime);$("dur").textContent=mmss(au.duration)}};
au.onended=()=>step(1);
$("seek").oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};

/* ---------------- Rendu ---------------- */
function render(){
  const q=S.q.toLowerCase(),off=!navigator.onLine;
  const l=S.tracks.filter(t=>!q||(t.title+" "+t.artist).toLowerCase().includes(q));
  $("cnt").textContent=S.tracks.length;$("empty").style.display=S.tracks.length?"none":"block";
  $("list").innerHTML=l.map(t=>`<li class="${t.id===S.cur?"on":""} ${off&&t.p!=="local"?"dis":""}" data-id="${esc(t.id)}">
    ${t.thumb?`<img class="th" src="${esc(t.thumb)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=th>${ICON[t.p]}</div>'">`
             :`<div class="th">${ICON[t.p]}</div>`}
    <div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist||"—")}</div></div>
    <span class="tag ${t.p}">${t.p}</span><button class="x" data-del="1">✕</button></li>`).join("");
}
$("list").addEventListener("click",async e=>{
  const li=e.target.closest("li");if(!li)return;const id=li.dataset.id;
  if(e.target.dataset.del){
    const t=S.tracks.find(x=>x.id===id);if(t&&t.p==="local")await fDel(id);
    S.tracks=S.tracks.filter(x=>x.id!==id);
    if(S.cur===id){S.cur=null;au.pause();$("frame").innerHTML="";$("ctrl").classList.add("hide");
      $("npt").textContent="Aucun titre";$("npa").textContent="Choisis un morceau dans la liste"}
    await save();render();
  }else play(id);
});
$("go").onclick=importUrl;
$("url").addEventListener("keydown",e=>{if(e.key==="Enter")importUrl()});
$("q").addEventListener("input",e=>{S.q=e.target.value;render()});
$("pick").onclick=()=>$("file").click();
$("file").addEventListener("change",e=>{addFiles(e.target.files);e.target.value=""});
function net(){document.body.classList.toggle("offline",!navigator.onLine);$("dot").classList.toggle("off",!navigator.onLine);render()}
addEventListener("online",net);addEventListener("offline",net);

(async()=>{
  try{S.tracks=JSON.parse(await DB.get("library"))||[]}catch(e){S.tracks=[]}
  net();render();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
</html>
