<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ma Playlist</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0b11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Playlist">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0b11;--card:#1a1a26;--line:#2a2a3a;--txt:#ecebf5;--dim:#8b89a3;--acc:#a855f7;--acc2:#22d3ee}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:
  radial-gradient(800px 500px at 10% -10%,#2a1152 0,transparent 60%),
  radial-gradient(700px 400px at 100% 5%,#07323b 0,transparent 55%),var(--bg);
  color:var(--txt);min-height:100vh;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top) + 16px) 15px calc(210px + env(safe-area-inset-bottom)) 15px}
.wrap{max-width:720px;margin:0 auto}
@keyframes up{from{opacity:0;transform:translateY(9px)}}
@keyframes pop{from{opacity:0;transform:scale(.93)}}
@keyframes slide{from{opacity:0;transform:translateY(40px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}
@keyframes shim{to{background-position:200% 0}}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.95)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.75}}
header{display:flex;align-items:center;gap:9px;margin-bottom:14px;animation:up .4s both}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,var(--acc) 65%,var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hb{margin-left:auto;display:flex;gap:7px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80;animation:glow 2.4s infinite}
.dot.off{background:#fb923c;box-shadow:0 0 10px #fb923c}
.iconb{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--dim);width:36px;height:36px;
  border-radius:11px;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.18s}
.iconb:active{transform:scale(.9);background:rgba(168,85,247,.25);color:#fff}
.offbar{display:none;background:rgba(251,146,60,.13);border:1px solid rgba(251,146,60,.3);color:#fdba74;
  border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.5;margin-bottom:13px;animation:up .3s both}
body.offline .offbar{display:block}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;animation:up .45s both}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:99px;
  padding:9px 15px;font-size:13px;font-weight:600;transition:.2s;white-space:nowrap}
.tab span{opacity:.6;font-size:11px;margin-left:5px}
.tab.on{background:linear-gradient(135deg,var(--acc),#7c3aed);border-color:transparent;color:#fff;
  box-shadow:0 5px 18px rgba(168,85,247,.35);transform:translateY(-1px)}
.tab:active{transform:scale(.95)}
.tab.add{background:transparent;border-style:dashed;padding:9px 13px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:13px;animation:up .5s both}
.row{display:flex;gap:8px}
input[type=text],input[type=search],input[type=password]{flex:1;min-width:0;background:#0e0e17;border:1px solid var(--line);
  color:var(--txt);border-radius:11px;padding:12px 13px;font-size:16px;outline:none;transition:.2s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
button{border:none;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:650;color:#fff;
  background:linear-gradient(135deg,var(--acc),#7c3aed);cursor:pointer;flex-shrink:0;transition:.18s}
button:active{transform:scale(.94)}
button:disabled{opacity:.45}
.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500;padding:11px 14px;font-size:13px}
.ghost:active{border-color:var(--acc);color:#fff}
.files{display:block;width:100%;margin-top:9px;text-align:center}
input[type=file]{display:none}
.msg{font-size:12.5px;color:var(--dim);margin-top:10px;min-height:16px;line-height:1.5}
.msg.ok{color:#4ade80}.msg.err{color:#fb7185}
.prog{height:3px;background:#26263a;border-radius:9px;overflow:hidden;margin-top:10px;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:40%;border-radius:9px;
  background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);background-size:200% 100%;animation:shim 1.1s linear infinite}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.bar h2{font-size:14px;font-weight:700;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{background:rgba(168,85,247,.17);color:#d8b4fe;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700}
.bar input{padding:8px 11px;font-size:14px}
ul{list-style:none;display:flex;flex-direction:column;gap:7px}
li{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid transparent;border-radius:13px;
  padding:9px 10px;transition:.18s;animation:up .3s both}
li:active{transform:scale(.985);background:#21212f}
li.on{border-color:var(--acc);background:linear-gradient(90deg,rgba(168,85,247,.22),rgba(34,211,238,.05));box-shadow:0 4px 20px rgba(168,85,247,.18)}
li.dis{opacity:.4}
.th{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#2a2a3a;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:17px;overflow:hidden}
.meta{flex:1;min-width:0}
.t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.eq{display:flex;gap:2px;align-items:flex-end;height:13px;flex-shrink:0}
.eq i{width:3px;border-radius:2px;background:var(--acc);animation:eq .85s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
.tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 6px;border-radius:5px;flex-shrink:0}
.tag.deezer{background:rgba(162,56,255,.2);color:#c88aff}
.tag.spotify{background:rgba(29,185,84,.18);color:#4ade80}
.tag.youtube{background:rgba(255,0,51,.18);color:#ff7a94}
.tag.local{background:rgba(34,211,238,.18);color:#67e8f9}
.x{background:none;border:none;color:#5c5a70;padding:8px;font-size:15px}
.empty{text-align:center;padding:32px 14px;color:var(--dim);font-size:13.5px;line-height:1.6;animation:pop .35s both}
.empty b{display:block;font-size:30px;margin-bottom:8px}
/* lecteur */
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,14,23,.94);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding:11px 15px calc(11px + env(safe-area-inset-bottom)) 15px;animation:slide .45s both}
.pwrap{max-width:720px;margin:0 auto}
.ptop{display:flex;align-items:center;gap:11px}
.pth{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#2a2a3a;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:17px}
.npt{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npa{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcb{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--dim);font-size:11px;font-weight:700;
  padding:7px 9px;border-radius:9px;flex-shrink:0}
#ytwrap{height:0;overflow:hidden;transition:height .3s ease;border-radius:11px}
#ytwrap.show{height:190px;margin-top:9px}
#ytmount,#ytmount iframe{width:100%;height:190px;border:none;border-radius:11px;display:block}
#frame iframe{width:100%;border:none;border-radius:11px;margin-top:9px;background:#000;display:block;animation:pop .3s both}
.ctrl{display:flex;align-items:center;gap:13px;margin-top:10px;animation:pop .3s both}
.ctrl button{background:none;padding:4px;font-size:20px;color:var(--txt)}
.ctrl .pp{background:var(--txt);color:#0b0b11;width:44px;height:44px;border-radius:50%;font-size:16px;
  display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 16px rgba(255,255,255,.14)}
.seek{flex:1;display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:9px;background:#39394f;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px rgba(168,85,247,.7)}
.hide{display:none!important}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
/* modales */
.ov{position:fixed;inset:0;background:rgba(5,5,10,.72);backdrop-filter:blur(7px);z-index:90;
  display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:pop .2s both}
.ov.hide{display:none}
.mod{background:#161622;border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:440px;
  margin-bottom:env(safe-area-inset-bottom);animation:slide .3s cubic-bezier(.2,.9,.3,1.1) both}
.mod h3{font-size:16px;font-weight:750;margin-bottom:5px}
.mod p{font-size:12.5px;color:var(--dim);line-height:1.55;margin-bottom:13px}
.mod .row{margin-top:13px}
.mod a{color:var(--acc2)}
.sheet button{width:100%;text-align:left;margin-top:8px;background:#1f1f2e;border:1px solid var(--line);
  color:var(--txt);font-weight:600;font-size:14px;padding:14px}
.sheet button:active{background:#2a2a3d}
.sheet .dgr{color:#fda4af}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);z-index:95;
  background:#1c1c2b;border:1px solid var(--line);color:var(--txt);padding:11px 16px;border-radius:13px;font-size:13px;
  font-weight:600;box-shadow:0 10px 34px rgba(0,0,0,.5);animation:tin .28s both;max-width:90vw;text-align:center}
.toast.ok{border-color:rgba(74,222,128,.45);color:#86efac}
.toast.err{border-color:rgba(251,113,133,.45);color:#fda4af}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ma Playlist</h1>
    <div class="hb"><div class="dot" id="dot"></div><button class="iconb" id="set">⚙</button></div>
  </header>
  <div class="offbar">📴 Hors connexion — tes fichiers locaux restent lisibles, le streaming revient avec le réseau.</div>
  <div class="tabs" id="tabs"></div>
  <div class="panel">
    <div class="row">
      <input type="text" id="url" placeholder="Lien Deezer, Spotify ou YouTube" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="go">Importer</button>
    </div>
    <button class="ghost files" id="pick">📁 Ajouter mes fichiers audio (hors connexion, sans pub)</button>
    <input type="file" id="file" accept="audio/*" multiple>
    <div class="prog" id="prog"><i></i></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="panel">
    <div class="bar"><h2 id="plname">Titres</h2><span class="cnt" id="cnt">0</span>
      <input type="search" id="q" placeholder="Rechercher…"></div>
    <ul id="list"></ul>
    <div class="empty" id="empty"><b>🎧</b>Playlist vide.<br>Colle un lien ou ajoute tes fichiers.</div>
  </div>
</div>

<div class="player">
  <div class="pwrap">
    <div class="ptop">
      <div class="pth" id="pth">🎧</div>
      <div style="flex:1;min-width:0"><div class="npt" id="npt">Aucun titre</div><div class="npa" id="npa">Choisis un morceau</div></div>
      <button class="srcb hide" id="vidb">🎬</button>
      <button class="srcb hide" id="srcb">🎵</button>
      <button class="srcb hide" id="openb">↗</button>
    </div>
    <div id="ytwrap"><div id="ytmount"></div></div>
    <div id="frame"></div>
    <div class="ctrl hide" id="ctrl">
      <button id="prev">⏮</button><button class="pp" id="pp">▶</button><button id="next">⏭</button>
      <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" value="0" min="0" max="1000"><span id="dur">0:00</span></div>
    </div>
  </div>
</div>
<audio id="au"></audio>
<div class="ov hide" id="ov"><div class="mod" id="mod"></div></div>

<script>
/* ===== Stockage ===== */
const DB={
 async get(k){if(window.storage){try{const r=await window.storage.get(k);return r?r.value:null}catch(e){return null}}
  try{return localStorage.getItem(k)}catch(e){return null}},
 async set(k,v){if(window.storage){try{await window.storage.set(k,v)}catch(e){}return}
  try{localStorage.setItem(k,v)}catch(e){}}};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("plfiles",1);
 r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function fPut(id,b){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");
 t.objectStore("f").put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fGet(id){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readonly"),
 q=t.objectStore("f").get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function fDel(id){const d=await idb();return new Promise(r=>{const t=d.transaction("f","readwrite");
 t.objectStore("f").delete(id);t.oncomplete=r;t.onerror=r})}

/* ===== État ===== */
const S={pls:[],act:null,cur:null,q:"",key:"",ytMode:true,url:null,mode:null};
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON={deezer:"🎵",spotify:"🟢",youtube:"▶️",local:"💾"};
const mmss=s=>isFinite(s)&&s>0?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const PL=()=>S.pls.find(p=>p.id===S.act)||S.pls[0];
const say=(t,k="")=>{$("msg").innerHTML=t;$("msg").className="msg "+k};
const busy=b=>$("prog").classList.toggle("on",b);
const save=()=>DB.set("pldata",JSON.stringify({pls:S.pls,act:S.act}));
function toast(t,k=""){const d=document.createElement("div");d.className="toast "+k;d.textContent=t;
 document.body.appendChild(d);setTimeout(()=>{d.style.transition=".3s";d.style.opacity=0;
 d.style.transform="translate(-50%,-12px)";setTimeout(()=>d.remove(),320)},2300)}
const refs=id=>S.pls.filter(p=>p.tracks.some(t=>t.id===id)).length;
async function copyTxt(t){try{await navigator.clipboard.writeText(t);return true}catch(e){
 const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity=0;
 document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}
 a.remove();return ok}}

/* ===== Modales ===== */
function closeM(){$("ov").classList.add("hide")}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeM()});
function ask(title,desc,val=""){return new Promise(res=>{
 $("mod").innerHTML=`<h3>${esc(title)}</h3><p>${desc}</p><input type="text" id="mi" value="${esc(val)}" maxlength="40">
 <div class="row"><button class="ghost" style="flex:1" id="mc">Annuler</button><button style="flex:1" id="mo">Valider</button></div>`;
 $("ov").classList.remove("hide");setTimeout(()=>$("mi").focus(),120);
 $("mc").onclick=()=>{closeM();res(null)};$("mo").onclick=()=>{const v=$("mi").value.trim();closeM();res(v||null)};
 $("mi").onkeydown=e=>{if(e.key==="Enter")$("mo").click()}})}
function confirmM(title,desc){return new Promise(res=>{
 $("mod").innerHTML=`<h3>${esc(title)}</h3><p>${desc}</p><div class="row">
 <button class="ghost" style="flex:1" id="mc">Annuler</button>
 <button style="flex:1;background:linear-gradient(135deg,#f43f5e,#be123c)" id="mo">Supprimer</button></div>`;
 $("ov").classList.remove("hide");$("mc").onclick=()=>{closeM();res(false)};$("mo").onclick=()=>{closeM();res(true)}})}

/* ===== Menu playlist ===== */
function plMenu(){
 const pl=PL(),others=S.pls.filter(p=>p.id!==pl.id);
 $("mod").innerHTML=`<div class="sheet"><h3>${esc(pl.name)}</h3><p>${pl.tracks.length} titre(s)</p>
 <button data-a="ren">✏️ Renommer</button>
 <button data-a="dup">⧉ Dupliquer la playlist</button>
 ${others.length?`<button data-a="cop">📋 Copier tous les titres vers…</button>`:""}
 <button data-a="txt">📝 Copier la liste en texte</button>
 ${S.pls.length>1?`<button class="dgr" data-a="del">🗑 Supprimer la playlist</button>`:""}
 <button class="ghost" style="margin-top:12px;text-align:center" data-a="x">Fermer</button></div>`;
 $("ov").classList.remove("hide");
 $("mod").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;
  if(a==="x")return closeM();
  if(a==="ren"){closeM();const n=await ask("Renommer","Nouveau nom de la playlist.",pl.name);
   if(n){pl.name=n;await save();render();toast("Renommée","ok")}return}
  if(a==="dup"){closeM();const n=await ask("Dupliquer","Nom de la copie.",pl.name+" (copie)");
   if(!n)return;S.pls.push({id:uid("pl"),name:n,tracks:pl.tracks.map(t=>({...t}))});
   S.act=S.pls[S.pls.length-1].id;await save();render();toast(`${pl.tracks.length} titres copiés`,"ok");return}
  if(a==="cop"){closeM();pickTarget(pl);return}
  if(a==="txt"){closeM();
   const txt=pl.tracks.map(t=>(t.artist?t.artist+" - ":"")+t.title).join("\n");
   toast(await copyTxt(txt)?"Liste copiée dans le presse-papiers":"Copie refusée par le navigateur",
    await copyTxt(txt)?"ok":"err");return}
  if(a==="del"){closeM();
   if(!await confirmM("Supprimer la playlist ?",`« ${esc(pl.name)} » et ses ${pl.tracks.length} titres.`))return;
   for(const t of pl.tracks)if(t.p==="local"&&refs(t.id)<2)await fDel(t.id);
   S.pls=S.pls.filter(p=>p.id!==pl.id);S.act=S.pls[0].id;stop();await save();render();toast("Playlist supprimée")}}}

function pickTarget(src){
 const others=S.pls.filter(p=>p.id!==src.id);
 $("mod").innerHTML=`<div class="sheet"><h3>Copier ${src.tracks.length} titres vers…</h3>
 <p>Les doublons sont ignorés automatiquement.</p>
 ${others.map(p=>`<button data-t="${esc(p.id)}">${esc(p.name)} <span style="color:var(--dim);font-weight:500">· ${p.tracks.length}</span></button>`).join("")}
 <button class="ghost" style="margin-top:12px;text-align:center" data-t="x">Annuler</button></div>`;
 $("ov").classList.remove("hide");
 $("mod").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.t;if(!id)return;
  if(id==="x")return closeM();
  const dst=S.pls.find(p=>p.id===id),have=new Set(dst.tracks.map(t=>t.id));
  const add=src.tracks.filter(t=>!have.has(t.id)).map(t=>({...t}));
  dst.tracks=dst.tracks.concat(add);await save();render();closeM();
  toast(add.length?`${add.length} titres copiés vers ${dst.name}`:"Tout y était déjà","ok")}}

function settings(){
 $("mod").innerHTML=`<h3>Réglages</h3>
 <p>Deezer ne diffuse que <b>30 s par morceau</b> dans son lecteur intégré. Avec une clé
 <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">YouTube Data API v3</a> (gratuite),
 l'app retrouve chaque titre sur YouTube, le joue <b>en entier</b> et importe tes playlists YouTube vidéo par vidéo.</p>
 <input type="password" id="k" placeholder="AIza…" value="${esc(S.key)}">
 <label style="display:flex;align-items:center;gap:9px;font-size:13px;color:var(--dim);margin-top:12px">
  <input type="checkbox" id="ym" ${S.ytMode?"checked":""} style="width:19px;height:19px;accent-color:var(--acc)">
  Lecture complète via YouTube quand c'est possible</label>
 <div class="row"><button class="ghost" style="flex:1" id="exp">⬇ Exporter</button>
 <button class="ghost" style="flex:1" id="imp">⬆ Importer</button><button style="flex:1" id="ok">OK</button></div>`;
 $("ov").classList.remove("hide");
 $("ok").onclick=async()=>{S.key=$("k").value.trim();S.ytMode=$("ym").checked;
  await DB.set("ytkey",S.key);await DB.set("ytmode",S.ytMode?"1":"0");closeM();toast("Réglages enregistrés","ok")};
 $("exp").onclick=()=>{const b=new Blob([JSON.stringify({pls:S.pls},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="mes-playlists-"+new Date().toISOString().slice(0,10)+".json";a.click();toast("Sauvegarde exportée","ok")};
 $("imp").onclick=()=>$("imf").click()}

/* ===== Liens & import ===== */
function parse(u){u=u.trim();let m;
 if(m=u.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/))
  return{p:"spotify",type:m[1],id:m[2],embed:`https://open.spotify.com/embed/${m[1]}/${m[2]}`,h:m[1]==="track"?152:300};
 if(m=u.match(/deezer\.(?:com|page\.link)\/(?:[a-z]{2}\/)?(track|album|playlist)\/(\d+)/))
  return{p:"deezer",type:m[1],id:m[2],embed:`https://widget.deezer.com/widget/dark/${m[1]}/${m[2]}`,h:m[1]==="track"?152:300};
 if(m=u.match(/[?&]list=([A-Za-z0-9_-]+)/))return{p:"youtube",type:"playlist",id:m[1],embed:`https://www.youtube.com/embed/videoseries?list=${m[1]}`,h:200};
 if(m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/))
  return{p:"youtube",type:"track",id:m[1],yt:m[1],embed:`https://www.youtube.com/embed/${m[1]}`,
   thumb:`https://img.youtube.com/vi/${m[1]}/mqdefault.jpg`,link:`https://youtu.be/${m[1]}`,h:200};
 return null}
function jsonp(url,ms=7000){return new Promise((res,rej)=>{
 const cb="dz"+Math.random().toString(36).slice(2),s=document.createElement("script");
 const t=setTimeout(()=>{end();rej(Error("timeout"))},ms);
 function end(){clearTimeout(t);delete window[cb];s.remove()}
 window[cb]=d=>{end();res(d)};s.onerror=()=>{end();rej(Error("ko"))};
 s.src=url+(url.includes("?")?"&":"?")+"output=jsonp&callback="+cb;document.body.appendChild(s)})}
async function deezerAll(type,id){let out=[],i=0;
 for(let p=0;p<15;p++){const d=await jsonp(`https://api.deezer.com/${type}/${id}/tracks?limit=100&index=${i}`);
  if(!d||!d.data||!d.data.length)break;
  d.data.forEach(t=>out.push({id:"dz"+t.id,p:"deezer",title:t.title,artist:(t.artist||{}).name||"",
   thumb:(t.album||{}).cover_small||"",embed:`https://widget.deezer.com/widget/dark/track/${t.id}`,
   link:t.link||`https://www.deezer.com/track/${t.id}`,h:152}));
  if(d.data.length<100)break;i+=100}
 return out}
async function ytList(id){let out=[],tok="";
 for(let p=0;p<10;p++){
  const r=await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${id}&key=${S.key}`+(tok?"&pageToken="+tok:""));
  const d=await r.json();if(d.error)throw Error(d.error.message||"refusé");
  (d.items||[]).forEach(it=>{const s=it.snippet,v=(s.resourceId||{}).videoId;
   if(!v||/^(Private|Deleted) video$/.test(s.title))return;
   out.push({id:"yt"+v,p:"youtube",yt:v,title:s.title,artist:(s.videoOwnerChannelTitle||"").replace(/ - Topic$/,""),
    thumb:`https://img.youtube.com/vi/${v}/mqdefault.jpg`,embed:`https://www.youtube.com/embed/${v}`,
    link:`https://youtu.be/${v}`,h:200})});
  tok=d.nextPageToken;if(!tok)break}
 return out}
async function ytFind(t){if(!S.key)return null;
 const q=encodeURIComponent((t.artist?t.artist+" ":"")+t.title);
 const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=1&q=${q}&key=${S.key}`);
 const d=await r.json();if(d.error)throw Error(d.error.message||"clé refusée");
 const it=(d.items||[])[0];return it?it.id.videoId:null}
async function oembed(p,url){try{
 const a=p==="spotify"?`https://open.spotify.com/oembed?url=${encodeURIComponent(url)}`
  :`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(url)}`;
 const r=await fetch(a);if(!r.ok)throw 0;const d=await r.json();return{title:d.title,thumb:d.thumbnail_url}
}catch(e){return null}}

async function importUrl(){
 const raw=$("url").value.trim();if(!raw)return say("Colle d'abord un lien.","err");
 if(!navigator.onLine)return say("Pas de réseau — l'import a besoin d'une connexion.","err");
 const i=parse(raw);if(!i)return say("Lien non reconnu (Deezer, Spotify ou YouTube).","err");
 $("go").disabled=true;busy(true);say('<span class="spin"></span>Récupération en cours…');
 let add=[];
 try{
  if(i.p==="deezer"&&i.type!=="track"){add=await deezerAll(i.type,i.id);if(!add.length)throw Error("vide")}
  else if(i.p==="youtube"&&i.type==="playlist"&&S.key){add=await ytList(i.id);if(!add.length)throw Error("vide")}
  else if(i.p==="youtube"&&i.type==="track"){const o=await oembed("youtube",raw);
   add=[{...i,id:"yt"+i.id,title:(o&&o.title)||"Vidéo YouTube",artist:""}]}
  else throw Error("one")}
 catch(e){
  const o=i.p==="deezer"?null:await oembed(i.p,raw);
  const lab={playlist:"Playlist",album:"Album",track:"Titre",episode:"Épisode",show:"Podcast"}[i.type]||"Média";
  add=[{id:i.p+i.id,p:i.p,title:(o&&o.title)||lab+" "+i.p,artist:i.type==="track"?"":lab+" complet · lecteur intégré",
   thumb:(o&&o.thumb)||i.thumb||"",embed:i.embed,link:raw,h:i.h}];
  if(i.p==="deezer"&&i.type!=="track")say("⚠️ API Deezer inaccessible ici (aperçu Claude) : playlist ajoutée en un bloc. En ligne, les titres arriveront un par un.","err");
  else if(i.p==="youtube"&&i.type==="playlist")say("Playlist YouTube ajoutée en un bloc. Mets une clé API dans ⚙️ pour séparer chaque vidéo.","ok");
  else if(i.type!=="track")say("Lister les titres n'est possible que sur Deezer ou YouTube — ajouté avec son lecteur.","ok")}
 const pl=PL(),seen=new Set(pl.tracks.map(t=>t.id)),fresh=add.filter(t=>!seen.has(t.id));
 pl.tracks=pl.tracks.concat(fresh);await save();render();
 $("url").value="";$("go").disabled=false;busy(false);
 if(fresh.length>1){say("");toast(`✅ ${fresh.length} titres ajoutés`,"ok")}
 else if(fresh.length===1&&!/ok|err/.test($("msg").className)){say("");toast("✅ Ajouté","ok")}
 else if(!fresh.length)toast("Déjà dans cette playlist")}

async function addFiles(fl){const pl=PL();let n=0;busy(true);
 for(const f of fl){const id=uid("lo");
  try{await fPut(id,f)}catch(e){toast("Mémoire insuffisante","err");continue}
  const nm=f.name.replace(/\.[^.]+$/,""),sp=nm.split(/\s+-\s+/);
  pl.tracks.push({id,p:"local",title:sp.length>1?sp.slice(1).join(" - "):nm,artist:sp.length>1?sp[0]:"Fichier local",thumb:""});n++}
 await save();render();busy(false);toast(n?`✅ ${n} fichier(s) · hors connexion`:"Aucun fichier ajouté",n?"ok":"err")}

/* ===== Lecteur YouTube piloté (sans habillage) ===== */
let ytp=null,ytReady=false;
function loadYT(){return new Promise(res=>{
 if(window.YT&&window.YT.Player)return res(true);
 window.onYouTubeIframeAPIReady=()=>res(true);
 const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=()=>res(false);
 document.head.appendChild(s);setTimeout(()=>res(!!(window.YT&&window.YT.Player)),5000)})}
async function playYT(vid){
 const ok=await loadYT();
 if(!ok||!window.YT||!window.YT.Player)return false;
 if(!ytp){ytp=new YT.Player("ytmount",{videoId:vid,
   playerVars:{playsinline:1,controls:1,rel:0,modestbranding:1,autoplay:1,iv_load_policy:3},
   events:{onReady:e=>e.target.playVideo(),
     onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)step(1);
      $("pp").textContent=e.data===YT.PlayerState.PLAYING?"⏸":"▶"},
     onError:()=>toast("Vidéo indisponible","err")}});ytReady=true}
 else ytp.loadVideoById(vid);
 return true}
setInterval(()=>{if(S.mode==="yt"&&ytp&&ytp.getDuration){
 const d=ytp.getDuration()||0,c=ytp.getCurrentTime()||0;
 if(d){$("seek").value=c/d*1000;$("cur").textContent=mmss(c);$("dur").textContent=mmss(d)}}},600);

/* ===== Lecture ===== */
const au=$("au");
function stop(){au.pause();if(ytp&&ytp.stopVideo)try{ytp.stopVideo()}catch(e){}
 S.cur=null;S.mode=null;$("frame").innerHTML="";$("ctrl").classList.add("hide");
 $("ytwrap").classList.remove("show");["vidb","srcb","openb"].forEach(i=>$(i).classList.add("hide"));
 $("npt").textContent="Aucun titre";$("npa").textContent="Choisis un morceau";$("pth").textContent="🎧"}

async function play(id){
 const pl=PL(),t=pl.tracks.find(x=>x.id===id);if(!t)return;
 S.cur=id;$("npt").textContent=t.title;$("npa").textContent=t.artist||"—";
 $("pth").outerHTML=t.thumb?`<img class="pth" id="pth" src="${esc(t.thumb)}" alt="">`:`<div class="pth" id="pth">${ICON[t.p]}</div>`;
 $("openb").classList.toggle("hide",!t.link);
 ["vidb","srcb"].forEach(i=>$(i).classList.add("hide"));
 $("ytwrap").classList.remove("show");

 if(t.p==="local"){
  if(ytp&&ytp.stopVideo)try{ytp.stopVideo()}catch(e){}
  S.mode="local";$("frame").innerHTML="";$("ctrl").classList.remove("hide");
  const b=await fGet(id);if(!b)return toast("Fichier introuvable","err");
  if(S.url)URL.revokeObjectURL(S.url);
  S.url=URL.createObjectURL(b);au.src=S.url;au.play().catch(()=>{});$("pp").textContent="⏸";return render()}

 au.pause();
 if(!navigator.onLine){S.mode=null;$("ctrl").classList.add("hide");
  $("frame").innerHTML=`<div style="padding:13px;font-size:12.5px;color:#fdba74">Streaming indisponible hors connexion.</div>`;return render()}

 let vid=t.yt&&t.yt!=="no"?t.yt:null;
 if(!vid&&S.ytMode&&t.p==="deezer"&&S.key){
  $("npa").innerHTML='<span class="spin"></span>Recherche de la version complète…';
  try{t.yt=await ytFind(t)||"no";await save();if(t.yt!=="no")vid=t.yt}catch(e){t.yt="no";toast("Clé YouTube refusée","err")}
  $("npa").textContent=t.artist||"—"}

 if(vid&&await playYT(vid)){
  S.mode="yt";$("frame").innerHTML="";$("ctrl").classList.remove("hide");
  $("vidb").classList.remove("hide");$("vidb").textContent="🎬";
  if(t.p==="deezer"){$("srcb").classList.remove("hide");$("srcb").textContent="🎵 30s";$("srcb").onclick=()=>embed(t)}
  return render()}
 embed(t);render()}

function embed(t){
 if(ytp&&ytp.stopVideo)try{ytp.stopVideo()}catch(e){}
 S.mode="embed";$("ctrl").classList.add("hide");$("ytwrap").classList.remove("show");$("vidb").classList.add("hide");
 $("frame").innerHTML=`<iframe src="${esc(t.embed)}" height="${t.h||152}" allow="autoplay; encrypted-media; clipboard-write; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
 if(t.yt&&t.yt!=="no"){$("srcb").classList.remove("hide");$("srcb").textContent="▶️ Complet";$("srcb").onclick=()=>play(t.id)}}

function step(d){const l=PL().tracks,i=l.findIndex(t=>t.id===S.cur);
 if(i<0)return;play(l[(i+d+l.length)%l.length].id)}
$("pp").onclick=()=>{
 if(S.mode==="local"){au.paused?(au.play(),$("pp").textContent="⏸"):(au.pause(),$("pp").textContent="▶")}
 else if(S.mode==="yt"&&ytp){ytp.getPlayerState()===1?ytp.pauseVideo():ytp.playVideo()}};
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
$("vidb").onclick=()=>{const w=$("ytwrap").classList.toggle("show");$("vidb").textContent=w?"🎧":"🎬"};
$("openb").onclick=()=>{const t=PL().tracks.find(x=>x.id===S.cur);if(t&&t.link)open(t.link,"_blank")};
au.ontimeupdate=()=>{if(au.duration){$("seek").value=au.currentTime/au.duration*1000;
 $("cur").textContent=mmss(au.currentTime);$("dur").textContent=mmss(au.duration)}};
au.onended=()=>step(1);
$("seek").oninput=e=>{const v=e.target.value/1000;
 if(S.mode==="local"&&au.duration)au.currentTime=v*au.duration;
 else if(S.mode==="yt"&&ytp)ytp.seekTo(v*(ytp.getDuration()||0),true)};

/* ===== Rendu ===== */
function render(){const pl=PL();if(!pl)return;
 $("tabs").innerHTML=S.pls.map(p=>`<button class="tab ${p.id===S.act?"on":""}" data-pl="${esc(p.id)}">${esc(p.name)}<span>${p.tracks.length}</span></button>`).join("")
  +`<button class="tab add" data-new="1">＋ Playlist</button>`;
 $("plname").textContent=pl.name;
 const q=S.q.toLowerCase(),off=!navigator.onLine;
 const l=pl.tracks.filter(t=>!q||(t.title+" "+t.artist).toLowerCase().includes(q));
 $("cnt").textContent=pl.tracks.length;$("empty").style.display=pl.tracks.length?"none":"block";
 $("list").innerHTML=l.map((t,n)=>`<li class="${t.id===S.cur?"on":""} ${off&&t.p!=="local"?"dis":""}" data-id="${esc(t.id)}" style="animation-delay:${Math.min(n,14)*22}ms">
  ${t.thumb?`<img class="th" src="${esc(t.thumb)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=th>${ICON[t.p]}</div>'">`:`<div class="th">${ICON[t.p]}</div>`}
  <div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist||"—")}</div></div>
  ${t.id===S.cur?'<div class="eq"><i></i><i></i><i></i></div>':""}
  <span class="tag ${t.p}">${t.p}</span><button class="x" data-del="1">✕</button></li>`).join("")}

/* ===== Événements ===== */
$("tabs").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.new){const n=await ask("Nouvelle playlist","Donne-lui un nom.","Ma playlist "+(S.pls.length+1));
  if(!n)return;S.pls.push({id:uid("pl"),name:n,tracks:[]});S.act=S.pls[S.pls.length-1].id;
  await save();render();toast("Playlist créée","ok");return}
 const id=b.dataset.pl;if(!id)return;
 if(id===S.act)return plMenu();
 S.act=id;stop();await save();render()});

$("list").addEventListener("click",async e=>{const li=e.target.closest("li");if(!li)return;
 const id=li.dataset.id,pl=PL();
 if(e.target.dataset.del){const t=pl.tracks.find(x=>x.id===id);
  if(t&&t.p==="local"&&refs(id)<2)await fDel(id);
  pl.tracks=pl.tracks.filter(x=>x.id!==id);if(S.cur===id)stop();
  await save();render()}else play(id)});

$("go").onclick=importUrl;
$("url").addEventListener("keydown",e=>{if(e.key==="Enter")importUrl()});
$("q").addEventListener("input",e=>{S.q=e.target.value;render()});
$("pick").onclick=()=>$("file").click();
$("file").addEventListener("change",e=>{addFiles(e.target.files);e.target.value=""});
$("set").onclick=settings;
const imf=document.createElement("input");imf.type="file";imf.accept=".json,application/json";imf.id="imf";
imf.style.display="none";document.body.appendChild(imf);
imf.addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;
 try{const d=JSON.parse(await f.text());if(!d.pls)throw 0;
  const have=new Set(S.pls.map(p=>p.id));S.pls=S.pls.concat(d.pls.filter(p=>!have.has(p.id)));
  await save();render();closeM();toast("Playlists restaurées","ok")}catch(err){toast("Fichier illisible","err")}
 e.target.value=""});
function net(){document.body.classList.toggle("offline",!navigator.onLine);$("dot").classList.toggle("off",!navigator.onLine);render()}
addEventListener("online",net);addEventListener("offline",net);

(async()=>{let d=null;try{d=JSON.parse(await DB.get("pldata"))}catch(e){}
 if(d&&d.pls&&d.pls.length){S.pls=d.pls;S.act=d.act||d.pls[0].id}
 else{let old=[];try{old=JSON.parse(await DB.get("library"))||[]}catch(e){}
  S.pls=[{id:uid("pl"),name:"Ma playlist",tracks:old.map(t=>({...t,p:t.p||t.platform}))}];S.act=S.pls[0].id;await save()}
 S.key=await DB.get("ytkey")||"";S.ytMode=(await DB.get("ytmode"))!=="0";
 net();render();
 if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{})})();
</script>
